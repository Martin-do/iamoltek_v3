name: Build Check

# Builds every branch and pull request without deploying, so a broken build
# is caught before it is merged into main (which deploys to cPanel).
on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run build
